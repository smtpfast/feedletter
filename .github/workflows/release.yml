name: Release

# Publishes the version in package.json to npm when a matching v* tag is
# pushed. npm checks this workflow's identity with trusted publishing (OIDC),
# so no npm token is stored anywhere.
#
# Dependencies only run in the build job, which installs the locked versions
# with no install scripts and can only read the repo. The publish job installs
# nothing from the project: it publishes the tarball the build job packed, and
# it is the only job that can ask for the npm identity (id-token: write).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check that the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install, check and test
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Build and run the packed CLI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npm pack --ignore-scripts
          smoke="$RUNNER_TEMP/feedletter-smoke"
          mkdir -p "$smoke"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$smoke" "./feedletter-$VERSION.tgz"
          "$smoke/node_modules/.bin/feedletter" --version | grep -qx "$VERSION"
          "$smoke/node_modules/.bin/feedletter" build --content examples/content --base-url https://example.com --out "$smoke/out"
          test -s "$smoke/out/email.html"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: feedletter-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g --ignore-scripts npm@11.21.1

      - name: Publish to npm
        env:
          # No token: trusted publishing only. The empty value replaces the
          # placeholder token that setup-node sets.
          NODE_AUTH_TOKEN: ""
        run: |
          if npm view "feedletter@$VERSION" version > /dev/null 2>&1; then
            echo "feedletter@$VERSION is already on npm, skipping"
          else
            npm publish "./feedletter-$VERSION.tgz" --provenance --access public --ignore-scripts
          fi

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          echo "" >> "$notes"
          echo "Install with \`npm install -g feedletter@$VERSION\`." >> "$notes"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
